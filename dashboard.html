<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Porter Catering</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div>Porter Catering</div>
        <div>{{ name }} | <a href="/logout">Logout</a></div>
    </header>
    <div class="container">
        <a href="/new" class="btn big">+ New Catering Flight</a>
        <h2>Recent Flights</h2>
        {% if flights %}
            {% for f in flights %}
            <a href="/flight/{{ f.id }}" class="card">
                <strong>{{ f.flight_number }}</strong>
                <div class="meta">{{ f.date }} {{ f.time }} — {{ f.guard_name }}</div>
            </a>
            {% endfor %}
        {% else %}
            <p class="empty">No flights yet. Create the first one.</p>
        {% endif %}
    </div>
</body>
</html>
